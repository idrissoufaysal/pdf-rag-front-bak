[project]
name = "rag1"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "flashrank>=0.2.10",
    "langchain>=1.3.14",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-google-genai>=4.3.2",
    "langchain-groq>=1.1.3",
    "langchain-huggingface>=1.2.2",
    "langchain-openai>=0.3.0",
    "langfuse>=4.7.0",
    "numpy>=2.5.1",
    "pypdf>=6.14.2",
    "python-dotenv>=1.0.0",
    "python-multipart>=0.0.32",
    "rank-bm25>=0.2.2",
    "sentence-transformers>=5.6.1",
    "torch>=2.0.0",
    "uvicorn>=0.52.1",
]

# Forcer torch en version CPU uniquement (évite ~2.5Go de packages CUDA/GPU)
[tool.uv]
torch-backend = "cpu"
